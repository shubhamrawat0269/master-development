<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uploading Files</title>
  </head>
  <body>
    <h1>Upload a File</h1>
    <form
